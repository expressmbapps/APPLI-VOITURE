<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPRESS MB - Catalogue Cloud</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --danger: #e74c3c; --light: #f4f7f6; --whatsapp: #25D366; --akl: #e67e22; }
        body { font-family: sans-serif; background: var(--light); margin: 0; padding-bottom: 50px; }
        
        /* Zone technique au-dessus du titre pour le bouton déconnexion */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 5px 10px;
            background: #1a252f;
            min-height: 20px;
        }

        /* Bouton déconnexion ultra-discret et micro */
        .btn-logout {
            background: #c0392b;
            color: white;
            padding: 3px 8px;
            font-size: 10px;
            border-radius: 3px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            opacity: 0.8;
        }
        .btn-logout:hover { opacity: 1; background: #e74c3c; }

        /* En-tête principal propre et centré */
        header { 
            background: var(--primary); 
            color: white; 
            padding: 15px; 
            text-align: center; 
        }
        header h1 { margin: 0; font-size: 24px; }
        
        nav { display: flex; justify-content: center; background: #ddd; padding: 10px; gap: 10px; position: sticky; top: 0; z-index: 100; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        .btn-blue { background: var(--secondary); color: white; }
        .btn-grey { background: #7f8c8d; color: white; }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none !important; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .action-btn { width: 100%; background: var(--success); color: white; padding: 15px; font-size: 18px; border: none; border-radius: 5px; margin-top: 10px; cursor: pointer; }
        .btn-main-action { background: #2980b9; color: white; }
        
        /* Fenêtre de connexion */
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; margin-top: 50px; }
        .error { color: var(--danger); font-weight: bold; margin-top: 10px; }

        /* Grille des clés */
        .key-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .key-item { border: 2px solid #eee; padding: 10px; text-align: center; cursor: pointer; border-radius: 8px; background: white; position: relative; transition: 0.2s; }
        .key-item:hover { border-color: var(--secondary); }
        .key-item.selected { border-color: var(--success); background: #e8f8f0; transform: scale(1.02); }
        .key-item img { width: 100%; height: 110px; object-fit: contain; margin-bottom: 5px; }
        .price-tag { font-size: 0.85em; margin: 2px 0; }
        
        .recap { background: #eef2f7; padding: 15px; border-left: 5px solid var(--secondary); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .img-mini { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        #loader { text-align: center; padding: 50px; font-size: 1.2em; color: var(--secondary); }
    </style>
</head>
<body>

<div id="top-bar-container" class="top-bar hidden">
    <button id="header-logout" class="btn-logout" onclick="deconnexion()">❌ Déconnexion</button>
</div>

<header>
    <h1>🔑 EXPRESS MB</h1>
</header>

<div id="page-login" class="container">
    <div class="login-box">
        <h2>🔒 Accès Restreint</h2>
        <p>Identifiez-vous pour ouvrir le catalogue EXPRESS MB.</p>
        <input type="email" id="l-email" placeholder="Votre adresse email" required>
        <input type="password" id="l-code" placeholder="Votre code secret" required>
        <button class="action-btn" id="btn-login" onclick="verifierConnexion()">Se connecter</button>
        <p id="login-error" class="error hidden"></p>
    </div>
</div>

<div id="app-global-content" class="hidden">
    <nav>
        <button class="btn-blue" onclick="changerPage('user')">📱 COLLABORATEUR</button>
        <button class="btn-grey" onclick="accesAdmin()">⚙️ TECHNICIEN</button>
    </nav>

    <div class="container">
        <div id="loader">⏳ Chargement du catalogue Google...</div>

        <div id="page-user" class="page hidden">
            <div class="card">
                <h2>Trouver une clé</h2>
                <select id="u-marque" onchange="majFamilles()"><option value="">-- Choisir Marque --</option></select>
                <select id="u-type-cle" onchange="majPuces()" disabled><option value="">-- Type de clé --</option></select>
                <select id="u-type-puce" onchange="majGrille()" disabled><option value="">-- Type de puce --</option></select>

                <div id="u-grille-container" class="hidden">
                    <div id="grille-cles" class="key-grid"></div>
                    <button class="action-btn" id="btn-valider" onclick="ouvrirFormulaire()" style="display:none">Démarrer l'intervention</button>
                </div>
            </div>
        </div>

        <div id="page-formulaire" class="page hidden">
            <div class="card">
                <button onclick="changerPage('user')" style="background:none; color:var(--secondary); font-weight:bold; cursor:pointer; border:none;">⬅ Retour</button>
                <h2>Fiche d'intervention</h2>
                <div id="recap-cle" class="recap"></div>
                
                <!-- Sélection du technicien -->
                <select id="f-tech">
                    <option value="OLIVIER">Technicien: OLIVIER</option>
                    <option value="FRANCK">Technicien: FRANCK</option>
                </select>

                <!-- NOUVEAU : Sélection du collaborateur qui a pris la commande (10 noms) -->
                <label for="f-collab" style="font-size: 13px; font-weight: bold; color: #333; margin-top: 10px; display: block;">👥 Dossier pris par :</label>
                <select id="f-collab">
                    <option value="">-- Choisir le collaborateur --</option>
                    <option value="Nom 1">Nom 1</option>
                    <option value="Nom 2">Nom 2</option>
                    <option value="Nom 3">Nom 3</option>
                    <option value="Nom 4">Nom 4</option>
                    <option value="Nom 5">Nom 5</option>
                    <option value="Nom 6">Nom 6</option>
                    <option value="Nom 7">Nom 7</option>
                    <option value="Nom 8">Nom 8</option>
                    <option value="Nom 9">Nom 9</option>
                    <option value="Nom 10">Nom 10</option>
                </select>

                <select id="f-mission" onchange="majPrixRecap()">
                    <option value="DOUBLE DE CLÉ">Double de clé</option>
                    <option value="PERTE TOTALE">Perte totale (AKL)</option>
                </select>
                
                <input type="text" id="f-client" placeholder="Nom du Client">
                <input type="text" id="f-immat" placeholder="Immatriculation">
                <input type="text" id="f-tel" placeholder="Téléphone client">
                
                <!-- Champs date et heure côte à côte -->
                <div style="display: flex; gap: 10px; margin: 10px 0;">
                    <div style="flex: 1;">
                        <label for="f-date" style="font-size: 13px; font-weight: bold; color: #333;">📅 Date RDV :</label>
                        <input type="date" id="f-date">
                    </div>
                    <div style="flex: 1;">
                        <label for="f-heure" style="font-size: 13px; font-weight: bold; color: #333;">⏰ Heure RDV :</label>
                        <input type="time" id="f-heure">
                    </div>
                </div>

                <textarea id="f-notes" rows="3" placeholder="Lieu de l'intervention"></textarea>
                
                <!-- Bouton unique fusionnant l'agenda et WhatsApp -->
                <button class="action-btn btn-main-action" onclick="validerEtEnvoyerTout()">🚀 VALIDER, AJOUTER À L'AGENDA & ENVOYER</button>
            </div>
        </div>

        <div id="page-admin" class="page hidden">
            <div class="card">
                <h2 id="admin-form-title">Ajouter au Catalogue</h2>
                <input type="hidden" id="a-id">
                <input type="text" id="a-marque" placeholder="MARQUE (ex: RENAULT)">
                <input type="text" id="a-type-cle" placeholder="Type (ex: CARTE, PLIP...)">
                <input type="text" id="a-puce" placeholder="N° Puce (ex: ID46)">
                <input type="number" id="a-prix" placeholder="Prix Double (€)">
                <input type="number" id="a-prix-akl" placeholder="Prix AKL (€)">
                <textarea id="a-comm" placeholder="Commentaire technique"></textarea>

                <div style="background:#f9f9f9; padding:15px; border:2px dashed #ccc; text-align:center;">
                    <input type="file" id="a-photo" accept="image/*" onchange="uploadPhoto(this)">
                    <p id="upload-status">📸 Photo (optionnelle si modif)</p>
                </div>
                
                <button class="action-btn" id="btn-save" onclick="ajouterCleGoogle()">ENREGISTRER</button>
                <button class="action-btn btn-grey hidden" id="btn-cancel-edit" onclick="resetAdminForm()">ANNULER LA MODIFICATION</button>
            </div>

            <div class="card">
                <h3>Catalogue clés et télécommandes</h3>
                <div id="liste-admin"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    var SHEET_URL = "https://script.google.com/macros/s/AKfycbxun6gulkWcWTTAfD9Nv57T-39RjFECiVPu_kSLHCWq5DsqVvBVZUz_0dMx4WHC9GI9/exec"; 
    var CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dpxyoa6d5/image/upload";
    var UPLOAD_PRESET = "CATALOGUE"; 

    var catalogue = [];
    var idChoisi = null;
    var tempPhotoURL = null;

    // --- CONNEXION ---
    async function verifierConnexion() {
        var email = document.getElementById('l-email').value.trim();
        var code = document.getElementById('l-code').value.trim();
        var errEl = document.getElementById('login-error');
        var btnLogin = document.getElementById('btn-login');

        if(!email || !code) {
            alert("⚠️ Erreur : L'email ou le code est vide.");
            return;
        }

        errEl.classList.add('hidden');
        btnLogin.disabled = true;
        btnLogin.innerText = "⏳ Vérification...";

        try {
            var response = await fetch(SHEET_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: "login", email: email, code: code })
            });

            var textResponse = await response.text();

            if (textResponse.trim() === "OK" || textResponse.trim() === "Success") {
                localStorage.setItem('express_mb_logged', 'true');
                demarrerApplication();
            } else {
                errEl.innerText = "❌ Email ou code d'accès incorrect.";
                errEl.classList.remove('hidden');
                btnLogin.disabled = false;
                btnLogin.innerText = "Se connecter";
            }
        } catch (error) {
            errEl.innerText = "❌ Impossible de joindre le serveur.";
            errEl.classList.remove('hidden');
            btnLogin.disabled = false;
            btnLogin.innerText = "Se connecter";
        }
    }

    function demarrerApplication() {
        document.getElementById('page-login').classList.add('hidden');
        document.getElementById('app-global-content').classList.remove('hidden');
        document.getElementById('top-bar-container').classList.remove('hidden');
        chargerDonnees();
    }

    function deconnexion() {
        localStorage.removeItem('express_mb_logged');
        location.reload();
    }

    // --- CHARGEMENT ---
    async function chargerDonnees() {
        try {
            var response = await fetch(SHEET_URL);
            catalogue = await response.json();
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('page-user').classList.remove('hidden');
            initMarques();
        } catch (e) { document.getElementById('loader').innerText = "❌ Erreur de chargement du catalogue"; }
    }

    // --- NAVIGATION ---
    function changerPage(n) {
        document.querySelectorAll('.page').forEach(function(p) { p.classList.add('hidden'); });
        document.getElementById('page-'+n).classList.remove('hidden');
        if(n === 'admin') initTableAdmin();
    }
    function accesAdmin() { if(prompt("Code Technicien:") === "1234") changerPage('admin'); }

    // --- LOGIQUE CATALOGUE ---
    function initMarques() {
        var sel = document.getElementById('u-marque');
        var marques = [...new Set(catalogue.map(function(c) { return c.marque.trim().toUpperCase(); }))].sort();
        sel.innerHTML = '<option value="">-- Choisir Marque --</option>' + 
                        marques.map(function(m) { return '<option value="' + m + '">' + m + '</option>'; }).join('');
    }

    function majFamilles() {
        var m = document.getElementById('u-marque').value;
        var sel = document.getElementById('u-type-cle');
        
        var types = [...new Set(catalogue
            .filter(function(c) { return String(c.marque || '').trim().toUpperCase() === String(m).trim().toUpperCase(); })
            .map(function(c) { return String(c.type_cle || '').trim(); })
        )].filter(Boolean).sort();
        
        sel.innerHTML = '<option value="">-- Type --</option>' + types.map(function(t) { return '<option value="' + t + '">' + t + '</option>'; }).join('');
        sel.disabled = false;
        
        document.getElementById('u-type-puce').innerHTML = '<option value="">-- Puce --</option>';
        document.getElementById('u-type-puce').disabled = true;
        document.getElementById('u-grille-container').classList.add('hidden');
    }

    function majPuces() {
        var m = document.getElementById('u-marque').value;
        var t = document.getElementById('u-type-cle').value;
        var sel = document.getElementById('u-type-puce');
        
        var puces = [...new Set(catalogue
            .filter(function(c) { return String(c.marque || '').trim().toUpperCase() === String(m).trim().toUpperCase() && String(c.type_cle || '').trim() === String(t).trim(); })
            .map(function(c) { return String(c.type_puce || '').trim(); })
        )].filter(Boolean).sort();
        
        sel.innerHTML = '<option value="">-- Puce --</option>' + puces.map(function(p) { return '<option value="' + p + '">' + p + '</option>'; }).join('');
        sel.disabled = false;
        document.getElementById('u-grille-container').classList.add('hidden');
    }

    function majGrille() {
        var m = document.getElementById('u-marque').value.trim().toUpperCase();
        var t = document.getElementById('u-type-cle').value.trim().toUpperCase();
        var p = document.getElementById('u-type-puce').value.trim().toUpperCase();

        if(!m || !t || !p) return;

        var liste = catalogue.filter(function(c) {
            var marqueSheet = String(c.marque || '').trim().toUpperCase();
            var typeSheet = String(c.type_cle || '').trim().toUpperCase();
            var puceSheet = String(c.type_puce || '').trim().toUpperCase();
            return marqueSheet === m && typeSheet === t && puceSheet === p;
        });
        
        var grille = document.getElementById('grille-cles');
        
        if (liste.length === 0) {
            grille.innerHTML = '<p style="color:var(--danger); text-align:center; padding:10px; grid-column:1/-1;">⚠️ Aucune clé trouvée.</p>';
            document.getElementById('u-grille-container').classList.remove('hidden');
            return;
        }

        grille.innerHTML = liste.map(function(c) {
            var imageSrc = c.image ? c.image : 'https://via.placeholder.com/150?text=Pas+d+image';
            return '<div class="key-item" onclick="selectionnerCle(\'' + c.id + '\', this)">' +
                   '<img src="' + imageSrc + '">' +
                   '<div class="price-tag"><b>Double:</b> <span style="color:var(--success)">' + (c.prix || 'N/A') + '€</span></div>' +
                   '<div class="price-tag"><b>AKL:</b> <span style="color:var(--akl)">' + (c.prix_akl || 'N/A') + '€</span></div>' +
                   '<div style="font-size: 0.9em; margin-top: 5px; color: #666;"><i>' + (c.commentaire || '') + '</i></div>' +
                   '</div>';
        }).join('');

        document.getElementById('u-grille-container').classList.remove('hidden');
    }

    function selectionnerCle(id, el) {
        idChoisi = id;
        document.querySelectorAll('.key-item').forEach(function(i) { i.classList.remove('selected'); });
        el.classList.add('selected');
        document.getElementById('btn-valider').style.display = 'block';
    }

    function majPrixRecap() {
        var cle = catalogue.find(function(c) { return String(c.id) === String(idChoisi); });
        if(!cle) return;
        var typeMission = document.getElementById('f-mission').value;
        var prix = typeMission === "PERTE TOTALE" ? (cle.prix_akl || "Sur devis") : cle.prix;
        document.getElementById('recap-cle').innerHTML = '<b>' + cle.marque + '</b> - ' + cle.type_cle + '<br>Puce: ' + cle.type_puce + '<br>Tarif: <b>' + prix + '€</b>';
    }

    function ouvrirFormulaire() { majPrixRecap(); changerPage('formulaire'); }

    // Fonction unique combinant l'ajout à l'agenda et l'envoi WhatsApp en un seul clic
    async function validerEtEnvoyerTout() {
        var cle = catalogue.find(function(c) { return String(c.id) === String(idChoisi); });
        var mission = document.getElementById('f-mission').value;
        var tech = document.getElementById('f-tech').value;
        var collab = document.getElementById('f-collab').value; // Récupération du collaborateur sélectionné
        var client = document.getElementById('f-client').value;
        var immat = document.getElementById('f-immat').value;
        var telClient = document.getElementById('f-tel').value;
        var dateRdv = document.getElementById('f-date').value;
        var heureRdv = document.getElementById('f-heure').value;
        var noteIntervention = document.getElementById('f-notes').value || "Aucune";

        if (!dateRdv || !heureRdv) {
            alert("⚠️ Veuillez renseigner la date et l'heure du rendez-vous.");
            return;
        }

        var btnMain = document.querySelector('.btn-main-action');
        btnMain.disabled = true;
        btnMain.innerText = "⏳ Traitement en cours...";

        // 1. Enregistrement automatique dans l'agenda via Apps Script en arrière-plan
        var payload = {
            action: "add_calendar",
            tech: tech,
            collab: collab,
            mission: mission,
            client: client,
            immat: immat,
            tel: telClient,
            date: dateRdv,
            heure: heureRdv,
            lieu: noteIntervention
        };

        try {
            var response = await fetch(SHEET_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            });
            var result = await response.text();

            if (result.trim() !== "OK") {
                alert("⚠️ Erreur lors de l'ajout à l'agenda : " + result);
            }
        } catch (error) {
            console.error("Erreur réseau agenda:", error);
        } finally {
            btnMain.disabled = false;
            btnMain.innerText = "🚀 VALIDER, AJOUTER À L'AGENDA & ENVOYER";
        }

        // 2. Ouverture immédiate de WhatsApp pour prévenir le technicien
        var prix = mission === "PERTE TOTALE" ? (cle.prix_akl || "S/D") : cle.prix;
        var telTech = (tech === "OLIVIER") ? "33749504047" : "33666824460";

        var texte = "🚀 *MISSION - " + tech + "* \n\n" +
                    "👥 *Pris en charge par:* " + (collab || 'Non spécifié') + "\n" +
                    "📍 *Type:* " + mission + "\n" +
                    "👤 *Client:* " + client + "\n" +
                    "🚗 *Immat:* " + immat + "\n" +
                    "📱 *Tel:* " + telClient + "\n" +
                    "📅 *Date RDV:* " + dateRdv + "\n" +
                    "⏰ *Heure RDV:* " + heureRdv + "\n\n" +
                    "🔑 *Clé:* " + cle.marque + " " + cle.type_cle + "\n" +
                    "💰 *Prix:* " + prix + "€\n" +
                    "📝 *Lieu:* " + noteIntervention + "\n\n" +
                    "🖼 *Photo:* " + cle.image;

        window.open("https://wa.me/" + telTech + "?text=" + encodeURIComponent(texte), '_blank');
    }

    // --- ZONE ADMIN ---
    async function uploadPhoto(input) {
        var file = input.files[0]; if(!file) return;
        document.getElementById('upload-status').innerText = "⏳ Envoi...";
        var fd = new FormData(); fd.append('file', file); fd.append('upload_preset', UPLOAD_PRESET);
        try {
            var res = await fetch(CLOUDINARY_URL, { method:'POST', body:fd }).then(function(r) { return r.json(); });
            tempPhotoURL = res.secure_url;
            document.getElementById('upload-status').innerText = "✅ OK";
        } catch(e) { alert("Erreur photo Cloudinary"); }
    }

    async function ajouterCleGoogle() {
        var btn = document.getElementById('btn-save');
        var idExistante = document.getElementById('a-id').value;
        btn.disabled = true; btn.innerText = "⏳ Enregistrement...";

        var data = {
            action: idExistante ? "update" : "add",
            id: idExistante || "ID-"+Date.now(),
            marque: document.getElementById('a-marque').value.toUpperCase(),
            type_cle: document.getElementById('a-type-cle').value,
            type_puce: document.getElementById('a-puce').value,
            prix: document.getElementById('a-prix').value,
            prix_akl: document.getElementById('a-prix-akl').value,
            commentaire: document.getElementById('a-comm').value,
            image: tempPhotoURL
        };

        await fetch(SHEET_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(data)});
        alert("Enregistré !"); location.reload();
    }

    function preparerModification(id) {
        var cle = catalogue.find(function(c) { return String(c.id) === String(id); }); if(!cle) return;
        document.getElementById('admin-form-title').innerText = "✏️ Modifier " + cle.marque;
        document.getElementById('a-id').value = cle.id;
        document.getElementById('a-marque').value = cle.marque;
        document.getElementById('a-type-cle').value = cle.type_cle;
        document.getElementById('a-puce').value = cle.type_puce;
        document.getElementById('a-prix').value = cle.prix;
        document.getElementById('a-prix-akl').value = cle.prix_akl;
        document.getElementById('a-comm').value = cle.commentaire;
        tempPhotoURL = cle.image;
        document.getElementById('btn-save').innerText = "METTRE À JOUR";
        document.getElementById('btn-cancel-edit').classList.remove('hidden');
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function resetAdminForm() {
        document.getElementById('admin-form-title').innerText = "Ajouter au Catalogue";
        document.getElementById('a-id').value = ""; document.getElementById('btn-save').innerText = "ENREGISTRER";
        document.getElementById('btn-cancel-edit').classList.add('hidden'); document.getElementById('a-marque').value = "";
        tempPhotoURL = null;
    }

    async function supprimer(id) {
        if(!confirm("Supprimer cette clé ?")) return;
        await fetch(SHEET_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({action:"delete", id:id})});
        location.reload();
    }

    function initTableAdmin() {
        document.getElementById('liste-admin').innerHTML = '<table>' + catalogue.map(function(c) {
            return '<tr>' +
                   '<td><img src="' + c.image + '" class="img-mini"></td>' +
                   '<td><b>' + c.marque + '</b><br><small>' + c.type_cle + '</small></td>' +
                   '<td style="text-align:right">' +
                   '<button onclick="preparerModification(\'' + c.id + '\')" style="background:var(--secondary); color:white; margin-right:5px">✏️</button>' +
                   '<button onclick="supprimer(\'' + c.id + '\')" style="background:var(--danger); color:white">X</button>' +
                   '</td>' +
                   '</tr>';
        }).join('') + '</table>';
    }

    window.onload = function() {
        if (localStorage.getItem('express_mb_logged') === 'true') {
            demarrerApplication();
        }
    };
</script>
</body>
